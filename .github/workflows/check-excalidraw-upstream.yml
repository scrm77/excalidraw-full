name: Check Excalidraw upstream

on:
  schedule:
    - cron: "17 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the editor submodule
        run: git submodule update --init --depth 1 excalidraw

      - name: Compare pinned editor with official master
        id: upstream
        shell: bash
        run: |
          git -C excalidraw remote add official https://github.com/excalidraw/excalidraw.git || true
          git -C excalidraw fetch --quiet official master
          echo "pinned=$(git -C excalidraw rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "latest=$(git -C excalidraw rev-parse official/master)" >> "$GITHUB_OUTPUT"
          if git -C excalidraw merge-base --is-ancestor official/master HEAD; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the monthly review issue
        if: steps.upstream.outputs.behind == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Excalidraw upstream update available";
            const body = [
              "The monthly check found newer commits in official Excalidraw.",
              "",
              `Pinned editor: \`${{ steps.upstream.outputs.pinned }}\``,
              `Official master: \`${{ steps.upstream.outputs.latest }}\``,
              "",
              "Review the upstream changes, merge them into the custom editor fork, run the acceptance checks, and deploy only after a database backup. This workflow intentionally does not auto-deploy.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
